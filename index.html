<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10131d">
    <meta name="description" content="A tiny arcade challenge: catch the bugs before time runs out.">
    <title>Bug Hunt — DOM Arcade</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="arcade" id="game">
      <section class="game-shell" aria-labelledby="game-title">
        <div class="game-heading">
          <h1 id="game-title">Bug <span>Hunt</span></h1>
          <p class="intro">A rogue bug is loose in the grid. Catch as many as you can before it escapes.</p>
        </div>

        <div class="dashboard" aria-label="Game statistics">
          <div class="stat">
            <span class="stat-label">BUGS CAUGHT</span>
            <span class="stat-value" id="score">00</span>
          </div>
          <div class="stat timer-stat">
            <span class="stat-label">TIME LEFT</span>
            <span class="stat-value"><span id="timer">30</span><span class="stat-unit">SEC</span></span>
          </div>
          <div class="round-indicator" aria-label="Current round"><span class="round-dot" aria-hidden="true"></span> ROUND <span id="round-number">01</span></div>
        </div>

        <div class="board-wrap">
          <div class="board-topline"><span>SECTOR GRID</span><span id="game-hint">STANDBY</span></div>
          <div class="board" id="board" role="group" aria-label="Bug hunt grid" aria-describedby="game-rules"></div>
          <p class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></p>
        </div>

        <div class="game-footer">
          <div class="instructions"><span class="keycap">↑</span><span class="keycap">↓</span><span class="keycap">←</span><span class="keycap">→</span><span class="key-plus">+</span><span class="keycap keycap-wide">ENTER</span><span class="instruction-copy">to catch</span></div>
          <button class="start-button" id="start-button" type="button"><span class="button-label">START GAME</span></button>
        </div>
        <p class="game-rules" id="game-rules">Keyboard only · Bugs move faster every 5 catches. Press D to switch themes.</p>
        <p class="result" id="result" role="status" hidden></p>
      </section>

      <footer class="page-footer"><span>KEEP YOUR EYES ON THE GRID</span><span>BUILT WITH HTML · CSS · JS</span></footer>
    </main>
  </body>
</html>
